
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10051f">
<title>Mural Hyerdev | CBirdex Express</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#090510;
}

body{
 font-family:Arial,Helvetica,sans-serif;
}

#screen{
 position:relative;
 width:100vw;
 height:100vh;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 50%,#28103e 0%,#10051f 62%,#070510 100%);
}

#videoScene,#imageScene{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 opacity:0;
 visibility:hidden;
 transition:opacity .8s ease;
}

#videoScene.active,#imageScene.active{
 opacity:1;
 visibility:visible;
}

#videoBackdrop{
 position:absolute;
 inset:-5%;
 width:110%;
 height:110%;
 object-fit:cover;
 filter:blur(34px) brightness(.28) saturate(1.2);
 transform:scale(1.08);
}

#videoMain{
 position:relative;
 z-index:1;
 width:100%;
 height:100%;
 object-fit:contain;
}

#imageScene{
 background:#10051f;
}

#imageMain{
 width:100%;
 height:100%;
 object-fit:contain;
 display:block;
}

#shade{
 position:absolute;
 inset:0;
 pointer-events:none;
 z-index:2;
 background:linear-gradient(
  90deg,
  rgba(10,3,20,.12),
  transparent 25%,
  transparent 75%,
  rgba(10,3,20,.12)
 );
}

@media(prefers-reduced-motion:reduce){
 #videoScene,#imageScene{transition:none}
}
</style>
</head>

<body>

<main id="screen" aria-label="Mural institucional Hyerdev">

  <!-- VÍDEO INSTITUCIONAL -->

  <section id="videoScene" class="active"
           aria-label="Vídeo institucional Hyerdev">

    <video id="videoBackdrop"
           muted playsinline preload="auto"
           aria-hidden="true">

      <source src="assets/hyerdev-institucional.mp4"
              type="video/mp4">
    </video>

    <video id="videoMain"
           muted playsinline autoplay preload="auto">

      <source src="assets/hyerdev-institucional.mp4"
              type="video/mp4">
    </video>

    <div id="shade"></div>

  </section>


  <!-- IMAGENS INSTITUCIONAIS -->

  <section id="imageScene"
           aria-label="Soluções tecnológicas CBirdex">

    <img id="imageMain"
         src=""
         alt="Tecnologia Hyerdev e CBirdex Express">

  </section>

</main>


<script>

(() => {

  const videoScene = document.getElementById('videoScene');
  const imageScene = document.getElementById('imageScene');

  const video = document.getElementById('videoMain');
  const backdrop = document.getElementById('videoBackdrop');

  const image = document.getElementById('imageMain');


  // ORDEM DE EXIBIÇÃO DAS IMAGENS

  const slides = [

    {
      src:'assets/parceria-hyerdev-cbirdex.png',
      alt:'Parceria Hyerdev e CBirdex Express'
    },

    {
      src:'/mural-hyerdev/Área%20do%20Cliente%20CBirdEX%20Express%20(1).png',
      alt:'Área do Cliente CBirdex Express'
    },

    {
      src:'/mural-hyerdev/SACFlow_Atendimento%20Neon%20Centralizado.png',
      alt:'SACFlow - Atendimento CBirdex Express'
    }

  ];


  // TEMPO DE CADA IMAGEM: 9 SEGUNDOS

  const imageDuration = 9000;

  let imageTimer = null;
  let currentSlide = 0;


  // PRÉ-CARREGAMENTO DAS IMAGENS

  slides.forEach(slide => {
    const preload = new Image();
    preload.src = slide.src;
  });


  // EXIBIR VÍDEO

  function showVideo(){

    clearTimeout(imageTimer);

    imageScene.classList.remove('active');
    videoScene.classList.add('active');

    video.currentTime = 0;
    backdrop.currentTime = 0;

    video.play().catch(()=>{});
    backdrop.play().catch(()=>{});

  }


  // EXIBIR IMAGENS EM SEQUÊNCIA

  function showImage(index){

    clearTimeout(imageTimer);

    video.pause();
    backdrop.pause();

    currentSlide = index;

    image.src = slides[currentSlide].src;
    image.alt = slides[currentSlide].alt;

    videoScene.classList.remove('active');
    imageScene.classList.add('active');

    imageTimer = setTimeout(() => {

      if(currentSlide < slides.length - 1){

        showImage(currentSlide + 1);

      }else{

        showVideo();

      }

    }, imageDuration);

  }


  // QUANDO O VÍDEO TERMINAR

  video.addEventListener('ended', () => {
    showImage(0);
  });


  // SE O VÍDEO APRESENTAR ERRO

  video.addEventListener('error', () => {
    showImage(0);
  });


  // CONTROLE MANUAL PELO TECLADO

  document.addEventListener('keydown', e => {

    if(e.key === 'ArrowRight' || e.key === ' '){

      e.preventDefault();

      if(videoScene.classList.contains('active')){

        showImage(0);

      }else if(currentSlide < slides.length - 1){

        showImage(currentSlide + 1);

      }else{

        showVideo();

      }

    }

    if(e.key === 'ArrowLeft'){

      e.preventDefault();
      showVideo();

    }

  });


  // RETOMAR QUANDO O PAINEL VOLTAR

  document.addEventListener('visibilitychange', () => {

    if(!document.hidden &&
       videoScene.classList.contains('active') &&
       video.paused){

      video.play().catch(()=>{});
      backdrop.play().catch(()=>{});

    }

  });


  // INICIAR

  video.play().catch(()=>{});
  backdrop.play().catch(()=>{});

})();

</script>

</body>
</html>
